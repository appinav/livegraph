<!DOCTYPE html>
<html>
<head>
    <title>Smart Household Voltage Monitor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f7;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 950px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            color: #222;
        }

        .settings {
            margin: 20px 0;
        }

        label {
            font-weight: bold;
            margin: 10px;
        }

        input {
            padding: 10px;
            width: 100px;
            font-size: 16px;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        #voltage {
            font-size: 42px;
            font-weight: bold;
            margin: 20px;
        }

        .details {
            font-size: 18px;
            margin: 15px;
        }

        button {
            padding: 12px 22px;
            margin: 8px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #333;
            color: white;
        }

        button:hover {
            background: #555;
        }

        canvas {
            width: 100%;
            max-width: 900px;
            height: 450px;
            border: 1px solid #ccc;
            background: white;
            margin-top: 20px;
        }

        .info {
            margin-top: 15px;
            color: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>⚡ Smart Household Voltage Monitor</h1>

    <p>Real-Time Voltage Simulation</p>

    <!-- HOUSE SETTINGS -->

    <div class="settings">

        <label>🏠 Number of Rooms:</label>

        <input
            type="number"
            id="rooms"
            min="1"
            max="20"
            value="3"
        >

        <br><br>

        <label>👨‍👩‍👧‍👦 Number of People:</label>

        <input
            type="number"
            id="people"
            min="1"
            max="20"
            value="4"
        >

    </div>

    <button onclick="applySettings()">
        Apply Settings
    </button>

    <div class="details" id="houseInfo">
        House: 3 Rooms | 4 People
    </div>

    <hr>

    <div id="voltage">230.00 V</div>

    <button onclick="startGraph()">
        ▶ Start Monitoring
    </button>

    <button onclick="stopGraph()">
        ⏸ Stop
    </button>

    <button onclick="resetGraph()">
        ↻ Reset
    </button>

    <canvas id="graph" width="900" height="450"></canvas>

    <div class="info">
        X-Axis: Time (seconds) |
        Y-Axis: Voltage (V)
    </div>

</div>


<script>

const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");

let time = 0;
let voltage = 230;
let data = [];

let running = false;
let timer = null;

let rooms = 3;
let people = 4;


/* APPLY HOUSE SETTINGS */

function applySettings() {

    rooms = parseInt(
        document.getElementById("rooms").value
    );

    people = parseInt(
        document.getElementById("people").value
    );

    document.getElementById("houseInfo").innerHTML =
        "🏠 House: " +
        rooms +
        " Rooms | 👨‍👩‍👧‍👦 " +
        people +
        " People";

}


/* START GRAPH */

function startGraph() {

    if (running)
        return;

    running = true;

    timer = setInterval(
        updateGraph,
        1000
    );

}


/* STOP GRAPH */

function stopGraph() {

    running = false;

    clearInterval(timer);

}


/* RESET GRAPH */

function resetGraph() {

    stopGraph();

    time = 0;

    voltage = 230;

    data = [];

    document.getElementById(
        "voltage"
    ).innerHTML = "230.00 V";

    drawGraph();

}


/* GENERATE REALISTIC VOLTAGE */

function generateVoltage() {

    /*
    More rooms and more people
    can create slightly higher
    electrical activity.
    */

    let activity =
        (rooms * 0.15) +
        (people * 0.20);


    /* Normal voltage fluctuation */

    let change =
        (Math.random() - 0.5) *
        (1 + activity * 0.1);


    voltage += change;


    /* Occasional load increase */

    if (Math.random() < 0.08) {

        voltage -=
            Math.random() *
            (2 + activity * 0.3);

    }


    /* Small voltage recovery */

    if (Math.random() < 0.05) {

        voltage +=
            Math.random() *
            1.5;

    }


    /* Keep realistic voltage range */

    if (voltage > 240)
        voltage = 240;

    if (voltage < 220)
        voltage = 220;


    return voltage;

}


/* UPDATE GRAPH */

function updateGraph() {

    time++;

    let newVoltage =
        generateVoltage();


    data.push({

        time: time,

        voltage: newVoltage

    });


    /* Show last 60 readings */

    if (data.length > 60) {

        data.shift();

    }


    document.getElementById(
        "voltage"
    ).innerHTML =
        newVoltage.toFixed(2) +
        " V";


    drawGraph();

}


/* DRAW GRAPH */

function drawGraph() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const width =
        canvas.width;

    const height =
        canvas.height;


    const left = 70;
    const right = 30;
    const top = 30;
    const bottom = 60;


    const graphWidth =
        width - left - right;

    const graphHeight =
        height - top - bottom;


    /* GRID */

    ctx.strokeStyle = "#dddddd";

    ctx.lineWidth = 1;


    /* Horizontal lines */

    for (
        let v = 220;
        v <= 240;
        v += 5
    ) {

        let y =
            top +
            graphHeight -
            ((v - 220) / 20)
            * graphHeight;


        ctx.beginPath();

        ctx.moveTo(left, y);

        ctx.lineTo(
            width - right,
            y
        );

        ctx.stroke();


        ctx.fillStyle = "#333";

        ctx.font =
            "14px Arial";

        ctx.textAlign =
            "right";


        ctx.fillText(
            v + " V",
            left - 10,
            y + 5
        );

    }


    /* Vertical grid */

    for (
        let i = 0;
        i <= 6;
        i++
    ) {

        let x =
            left +
            (i / 6)
            * graphWidth;


        ctx.beginPath();

        ctx.moveTo(
            x,
            top
        );

        ctx.lineTo(
            x,
            height - bottom
        );

        ctx.stroke();


        ctx.fillStyle =
            "#333";

        ctx.font =
            "14px Arial";

        ctx.textAlign =
            "center";


        let label =
            Math.max(
                0,
                time - 60 +
                i * 10
            );


        ctx.fillText(
            label + " s",
            x,
            height - bottom + 25
        );

    }


    /* AXES */

    ctx.strokeStyle = "#222";

    ctx.lineWidth = 2;


    /* Y-axis */

    ctx.beginPath();

    ctx.moveTo(
        left,
        top
    );

    ctx.lineTo(
        left,
        height - bottom
    );

    ctx.stroke();


    /* X-axis */

    ctx.beginPath();

    ctx.moveTo(
        left,
        height - bottom
    );

    ctx.lineTo(
        width - right,
        height - bottom
    );

    ctx.stroke();


    /* AXIS LABELS */

    ctx.fillStyle =
        "#222";

    ctx.font =
        "bold 16px Arial";


    ctx.textAlign =
        "center";


    ctx.fillText(
        "Time (seconds)",
        width / 2,
        height - 15
    );


    ctx.save();

    ctx.translate(
        20,
        height / 2
    );

    ctx.rotate(
        -Math.PI / 2
    );


    ctx.fillText(
        "Voltage (V)",
        0,
        0
    );


    ctx.restore();


    /* DRAW VOLTAGE GRAPH */

    if (data.length < 2)
        return;


    ctx.beginPath();


    data.forEach(
        function(point, index) {

            let x =
                left +
                (index /
                (data.length - 1))
                * graphWidth;


            let y =
                top +
                graphHeight -
                ((point.voltage - 220)
                / 20)
                * graphHeight;


            if (index === 0) {

                ctx.moveTo(
                    x,
                    y
                );

            }

            else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }
    );


    ctx.strokeStyle =
        "#0077cc";

    ctx.lineWidth = 3;

    ctx.stroke();

}


/* INITIAL GRAPH */

drawGraph();

</script>

</body>
</html>
